            padding: 20px;

        }

            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        .header .tagline {
            font-size: 1.2em;
            opacity: 0.95;
            font-weight: 300;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            color: white;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            padding: 15px 25px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            outline: none;
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .filter-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.3);
        }

        .filter-btn.active {
            background: white;
            color: #1e3c72;
            border-color: white;
        }

        .category-section {
            margin-bottom: 40px;
        }

        .category-header {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 6px solid white;
        }

        .category-title {
            color: white;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .category-icon {
            font-size: 1.2em;
        }

        .category-count {
            font-size: 0.6em;
            background: rgba(255,255,255,0.3);
            padding: 5px 15px;
            border-radius: 20px;
            margin-left: auto;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .feature-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .feature-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #1e3c72, #7e22ce);
        }

        .feature-icon {
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .feature-title {
            font-size: 1.3em;
            color: #1e3c72;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .feature-description {
            color: #555;
            line-height: 1.6;
            font-size: 0.95em;
            margin-bottom: 15px;
        }

        .feature-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.75em;
            color: #555;
            font-weight: 600;
        }

        .tag.premium {
            background: #ffd700;
            color: #333;
        }

        .tag.ai {
            background: #e0e7ff;
            color: #4338ca;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }

            .stat-box {
                padding: 15px 20px;
            }

            .stat-number {
                font-size: 2em;
            }
        }
    </style>

                    card.innerHTML = `
                        <div class="feature-icon">${feature.icon}</div>
                        <div class="feature-title">${feature.title}</div>
                        <div class="feature-description">${feature.description}</div>
                        <div class="feature-tags">${tagsHTML}</div>
                    `;
                    grid.appendChild(card);
                });
            });

            if (container.innerHTML === '') {
                container.innerHTML = `
                    <div style="text-align: center; color: white; padding: 50px; font-size: 1.5em;">
                        No features found matching "${searchTerm}"
                    </div>
                `;
            }
        }

        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderFeatures();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderFeatures();
        });

        renderFeatures();
    </script>
</body>
</html>
